<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>محتوى الكورس | منصة الماهر التعليمية</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="CSS/style.css">
    <link rel="stylesheet" href="CSS/common.css">
</head>
<body>

    <!-- NAVBAR -->
    <header class="navbar">
        <div class="container nav-container">
            <a href="index.html" class="logo">
                <div class="logo-mark">M</div>
                <div class="logo-name">
                    <small>منصة</small>
                    <strong>المـاهر</strong>
                    <span>التعليمية</span>
                </div>
            </a>
            <div style="display: flex; gap: 10px; align-items: center;">
                <a href="index.html" class="primary-btn" style="padding: 8px 18px; font-size: 14px; text-decoration: none;">
                    ← العودة للكورسات
                </a>
            </div>
        </div>
    </header>

    <main style="padding: 60px 0; min-height: 80vh;">
        <div class="container">
            
            <!-- COURSE HEADER BANNER -->
            <div id="courseHeader" style="background: linear-gradient(135deg, #072b6b 0%, #0d47a1 100%); color: white; padding: 40px; border-radius: 24px; box-shadow: 0 15px 35px rgba(7, 43, 107, 0.25); margin-bottom: 40px; position: relative; overflow: hidden;">
                <span id="courseLevelBadge" style="background: var(--gold-gradient); color: #072b6b; padding: 6px 16px; border-radius: 20px; font-weight: 900; font-size: 13px; display: inline-block; margin-bottom: 12px;">المرحلة الدراسية</span>
                <h1 id="courseTitle" style="font-size: 36px; font-weight: 900; margin-bottom: 12px;">اسم الكورس التعليمي</h1>
                <p id="courseDesc" style="font-size: 16px; opacity: 0.9; max-width: 750px; line-height: 1.7; margin-bottom: 20px;">وصف تفصيلي للكورس والمهارات المكتسبة والمحتوى التعليمي المنظم.</p>
                
                <div style="display: flex; gap: 20px; border-top: 1px solid rgba(255,255,255,0.15); padding-top: 20px;">
                    <div><span style="opacity: 0.8;">الفرع: </span><strong id="courseSubject">الرياضيات العامة</strong></div>
                    <div><span style="opacity: 0.8;">الترم: </span><strong id="courseTerm">الترم الأول</strong></div>
                    <div><span style="opacity: 0.8;">قيمة الاشتراك: </span><strong id="coursePrice" style="color: var(--gold); font-size: 18px;">150 ج.م</strong></div>
                </div>
            </div>

            <!-- TABS FOR VIDEOS AND FILES -->
            <div style="display: flex; gap: 15px; margin-bottom: 30px; border-bottom: 2px solid var(--border); padding-bottom: 10px;">
                <button id="tabVideosBtn" onclick="switchTab('videos')" style="background: var(--blue-gradient); color: white; border: none; padding: 12px 28px; border-radius: 12px; font-weight: 800; font-size: 16px; cursor: pointer; display: flex; align-items: center; gap: 8px;">
                    <span>🎥 الفيديوهات والدرجات</span>
                    <span id="videosCountBadge" style="background: rgba(255,255,255,0.2); padding: 2px 8px; border-radius: 10px; font-size: 12px;">0</span>
                </button>
                <button id="tabFilesBtn" onclick="switchTab('files')" style="background: transparent; color: var(--text-light); border: none; padding: 12px 28px; border-radius: 12px; font-weight: 800; font-size: 16px; cursor: pointer; display: flex; align-items: center; gap: 8px;">
                    <span>📁 المذكرات والملفات (PDF)</span>
                    <span id="filesCountBadge" style="background: var(--gray-border); color: var(--text); padding: 2px 8px; border-radius: 10px; font-size: 12px;">0</span>
                </button>
            </div>

            <!-- TAB 1: VIDEOS -->
            <div id="tabVideos" style="display: block;">
                <div id="videosGrid" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 25px;">
                    <!-- Rendered Dynamically -->
                </div>
            </div>

            <!-- TAB 2: FILES -->
            <div id="tabFiles" style="display: none;">
                <div id="filesGrid" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px;">
                    <!-- Rendered Dynamically -->
                </div>
            </div>

        </div>
    </main>

    <script>
        // Auto Dark Mode Check
        if (localStorage.getItem('elmaher_dark_mode') === 'enabled') {
            document.documentElement.classList.add('dark-mode');
            document.body.classList.add('dark-mode');
        }

        const urlParams = new URLSearchParams(window.location.search);
        const courseId = urlParams.get('id');

        function switchTab(tab) {
            const tabV = document.getElementById('tabVideos');
            const tabF = document.getElementById('tabFiles');
            const btnV = document.getElementById('tabVideosBtn');
            const btnF = document.getElementById('tabFilesBtn');

            if (tab === 'videos') {
                tabV.style.display = 'block';
                tabF.style.display = 'none';
                btnV.style.background = 'var(--blue-gradient)';
                btnV.style.color = 'white';
                btnF.style.background = 'transparent';
                btnF.style.color = 'var(--text-light)';
            } else {
                tabV.style.display = 'none';
                tabF.style.display = 'block';
                btnF.style.background = 'var(--blue-gradient)';
                btnF.style.color = 'white';
                btnV.style.background = 'transparent';
                btnV.style.color = 'var(--text-light)';
            }
        }

        document.addEventListener("DOMContentLoaded", () => {
            const storedCourses = localStorage.getItem("courses");
            const coursesList = storedCourses ? JSON.parse(storedCourses) : [];
            const course = coursesList.find(c => c.id === courseId) || coursesList[0];

            if (course) {
                document.getElementById('courseTitle').textContent = course.name;
                document.getElementById('courseDesc').textContent = course.description || 'لا يوجد وصف حالياً.';
                document.getElementById('courseLevelBadge').textContent = `${course.level || 'جميع المراحل'}`;
                document.getElementById('courseSubject').textContent = course.subject || 'الرياضيات العامة';
                document.getElementById('courseTerm').textContent = course.term || 'الترم الأول';
                document.getElementById('coursePrice').textContent = `${course.price || '150'} ج.م`;
            }

            // Check subscription status
            const isSubscribed = localStorage.getItem(`subscribed_course_${courseId}`) === 'true';

            // Render Videos matching course
            const storedVideos = localStorage.getItem("videos");
            const videosList = storedVideos ? JSON.parse(storedVideos) : [];
            const courseVideos = videosList.filter(v => (!v.courseId || v.courseId === courseId) && (!v.status || v.status === 'published'));

            document.getElementById('videosCountBadge').textContent = courseVideos.length;
            const vGrid = document.getElementById('videosGrid');
            if (courseVideos.length === 0) {
                vGrid.innerHTML = `<div style="grid-column: 1/-1; text-align: center; padding: 40px; color: var(--gray); background: white; border-radius: 16px; border: 1px dashed var(--border); font-weight: 700;">لا توجد فيديوهات مضافة لهذا الكورس حالياً. 🎥</div>`;
            } else {
                let vHtml = "";
                courseVideos.forEach((v, index) => {
                    const btnText = isSubscribed ? "▶ تشغيل ومتابعة الدرس" : "🔒 محتوى مغلق للمشتركين (اشترك الآن)";
                    const btnStyle = isSubscribed 
                        ? "background: var(--blue-gradient); color: white;" 
                        : "background: #1e293b; color: #94a3b8; border: 1px solid #334155;";

                    vHtml += `
                        <div class="video-card" style="border-radius: 18px; padding: 22px; border: 1px solid var(--border); box-shadow: var(--shadow-md); display: flex; flex-direction: column; justify-content: space-between; position: relative;">
                            <div>
                                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
                                    <span style="background: rgba(56,189,248,0.15); color: #38bdf8; padding: 4px 12px; border-radius: 12px; font-size: 12px; font-weight: 800;">الدرس ${index + 1} 🎬</span>
                                    <span style="font-size: 13px; color: var(--gold); font-weight: 700;">⏱️ ${v.duration || '20 دقيقة'}</span>
                                </div>
                                <h3 style="font-size: 20px; font-weight: 900; color: #38bdf8; margin-bottom: 10px;">${v.title || 'عنوان الدرس الشارح'}</h3>
                                <p style="font-size: 14px; color: #cbd5e1; line-height: 1.6; margin-bottom: 20px;">${v.description || 'تغطية شاملة ومبسطة لأفكار ومسائل الدرس.'}</p>
                            </div>
                            <button onclick="handleVideoWatch('${v.url || '#'}', ${isSubscribed})" style="${btnStyle} width: 100%; border: none; padding: 12px; border-radius: 12px; font-weight: 800; font-size: 14px; cursor: pointer; box-shadow: 0 4px 14px rgba(0,0,0,0.05); font-family: inherit;">
                                ${btnText}
                            </button>
                        </div>
                    `;
                });
                vGrid.innerHTML = vHtml;
            }

            // Render Files matching course
            const storedFiles = localStorage.getItem("files");
            const filesList = storedFiles ? JSON.parse(storedFiles) : [];
            const courseFiles = filesList.filter(f => !f.courseId || f.courseId === courseId);

            document.getElementById('filesCountBadge').textContent = courseFiles.length;
            const fGrid = document.getElementById('filesGrid');
            if (courseFiles.length === 0) {
                fGrid.innerHTML = `<div style="grid-column: 1/-1; text-align: center; padding: 40px; color: var(--gray); background: var(--white); border-radius: 16px; border: 1px dashed var(--border); font-weight: 700;">لا توجد مذكرات أو ملفات مرفوعة لهذا الكورس حالياً. 📁</div>`;
            } else {
                let fHtml = "";
                courseFiles.forEach(f => {
                    const btnText = isSubscribed ? "تنزيل 📥" : "🔒 مغلق";
                    const btnStyle = isSubscribed 
                        ? "background: var(--blue-dark); color: white;" 
                        : "background: #1e293b; color: #94a3b8; border: 1px solid #334155;";

                    fHtml += `
                        <div class="file-card" style="border-radius: 16px; padding: 20px; border: 1px solid var(--border); box-shadow: var(--shadow-sm); display: flex; align-items: center; gap: 15px; position: relative;">
                            <div style="width: 52px; height: 52px; border-radius: 14px; background: linear-gradient(135deg, #ffb703 0%, #fb8500 100%); color: #072b6b; display: flex; align-items: center; justify-content: center; font-size: 26px; flex-shrink: 0; font-weight: 900;">📄</div>
                            <div style="flex: 1; overflow: hidden;">
                                <h4 style="font-size: 17px; font-weight: 900; color: #38bdf8; margin-bottom: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">${f.name || 'مذكرة شرح وامتحانات'}</h4>
                                <span style="font-size: 13px; color: #cbd5e1; font-weight: 700;">${f.size || 'PDF'} • مستر الماهر</span>
                            </div>
                            <button onclick="handleFileDownload('${f.url || '#'}', ${isSubscribed})" style="${btnStyle} padding: 10px 18px; border-radius: 10px; font-size: 13px; font-weight: 800; border: none; cursor: pointer; flex-shrink: 0; font-family: inherit;">
                                ${btnText}
                            </button>
                        </div>
                    `;
                });
                fGrid.innerHTML = fHtml;
            }
        });

        function handleVideoWatch(url, isSubscribed) {
            if (!isSubscribed) {
                alert('🔒 هذا الدرس خاص بالطلاب المشتركين فقط!\nمن فضلك قم بالاشتراك في الكورس أولاً لمشاهدة جميع الدرجات والفيديوهات الشارحة 🚀');
            } else {
                if (url && url !== '#') {
                    window.open(url, '_blank');
                } else {
                    alert('سيتم فتح وتشغيل فيديو الدرس للمشتركين!');
                }
            }
        }

        function handleFileDownload(url, isSubscribed) {
            if (!isSubscribed) {
                alert('🔒 تحميل المذكرات والملفات متاح للطلاب المشتركين فقط!\nقم بالاشتراك في الكورس لتنزيل جميع المذكرات والاختبارات بصيغة PDF 📥');
            } else {
                if (url && url !== '#') {
                    window.open(url, '_blank');
                } else {
                    alert('جاري فتح وتنزيل المذكرة التعليمية!');
                }
            }
        }
    </script>
</body>
</html>
