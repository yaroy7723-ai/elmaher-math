            <a href="courses.html">

            <a href="videos.html">

        <button class="logout" id="logoutBtn">↪ تسجيل الخروج</button>

        <header class="topbar">
            <div>

                        <small>مدرس الرياضيات</small>
                    </div>
                </div>
            </div>
        </header>

        <!-- SETTINGS CARD -->
        <section style="background: white; border-radius: 12px; border: 1px solid #e2e8f0; padding: 30px; max-width: 650px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05);">
            <form id="settingsForm">
                <div style="margin-bottom: 20px;">
                    <label style="display: block; font-weight: 700; margin-bottom: 8px;">اسم المعلم</label>
                    <input type="text" value="مستر أشرف الماهر" style="width: 100%; height: 48px; padding: 0 15px; border: 1px solid #cbd5e1; border-radius: 8px; font-family: inherit;">
                </div>

                <div style="margin-bottom: 20px;">
                    <label style="display: block; font-weight: 700; margin-bottom: 8px;">البريد الإلكتروني المخصص للمدرس</label>
                    <input type="email" value="elmaher2027@math.com" disabled style="width: 100%; height: 48px; padding: 0 15px; border: 1px solid #cbd5e1; background: #f8fafc; border-radius: 8px; font-family: inherit; color: #64748b;">
                </div>

                <div style="margin-bottom: 25px;">
                    <label style="display: block; font-weight: 700; margin-bottom: 8px;">المادة الدراسية</label>
                    <input type="text" value="الرياضيات (التفاضل والتكامل، الهندسة، الجبر)" style="width: 100%; height: 48px; padding: 0 15px; border: 1px solid #cbd5e1; border-radius: 8px; font-family: inherit;">
                </div>

                <button type="submit" style="background: var(--blue-dark); color: white; border: none; padding: 12px 28px; border-radius: 8px; font-weight: 800; font-family: inherit; cursor: pointer;">
                    حفظ التغييرات
                </button>
            </form>
        </section>
    </main>

    <script src="JS/settings.js"></script>
