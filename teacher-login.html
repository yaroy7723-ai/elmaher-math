<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>بوابة المدرس | الماهر في الرياضيات</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="CSS/teacher-login.css">

</head>

<body>

    <div class="auth-page">

        <div class="auth-card teacher-card">

            <!-- LOGO -->
            <div class="auth-logo">

                <div class="logo-symbol teacher-symbol">
                    👨‍🏫
                </div>

                <div>
                    <strong>بوابة المدرس</strong>
                    <span>منصة الماهر في الرياضيات</span>
                </div>

            </div>


            <!-- HEADER -->
            <div class="auth-header">

                <h1>
                    تسجيل دخول المعلم 🎓
                </h1>

                <p>
                    مرحباً بك مستر أشرف! قم بتسجيل الدخول للتحكم بالمحتوى والطلاب
                </p>

            </div>


            <!-- LOGIN FORM -->
            <form id="loginForm">

                <!-- EMAIL -->
                <div class="input-group">

                    <label for="email">
                        البريد الإلكتروني
                    </label>

                    <input
                        type="email"
                        id="email"
                        placeholder="example@almahermath.com"
                        autocomplete="email"
                        required
                    >

                </div>


                <!-- PASSWORD -->
                <div class="input-group">

                    <label for="password">
                        كلمة المرور
                    </label>

                    <input
                        type="password"
                        id="password"
                        placeholder="••••••••"
                        autocomplete="current-password"
                        required
                    >

                </div>


                <!-- OPTIONS -->
                <div class="form-options">

                    <label class="remember">

                        <input
                            type="checkbox"
                            id="remember"
                        >

                        <span>
                            تذكرني
                        </span>

                    </label>


                    <a href="#">
                        نسيت كلمة المرور؟
                    </a>

                </div>


                <!-- MESSAGE -->
                <div
                    id="loginMessage"
                    class="auth-message"
                ></div>


                <!-- LOGIN BUTTON -->
                <button
                    type="submit"
                    class="login-btn"
                    id="loginButton"
                >
                    تسجيل الدخول
                </button>

            </form>


            <!-- DIVIDER -->
            <div class="divider">

                <span>
                    أو
                </span>

            </div>


            <!-- REGISTER -->
            <div class="register-link">

                ليس لديك حساب؟

                <a href="register.html">
                    إنشاء حساب جديد
                </a>

            </div>

        </div>

    </div>

    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <!-- AUTH JS -->
    <script src="JS/teacher-login.js"></script>

</body>

</html>
