<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول | منصة الماهر</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="CSS/login.css">
    <link rel="stylesheet" href="CSS/common.css">
</head>
<body style="background: linear-gradient(135deg, #072b6b 0%, #0d47a1 100%); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; font-family: 'Cairo', sans-serif;">

    <div class="auth-card" style="background: white; width: 100%; max-width: 450px; border-radius: 24px; padding: 35px; box-shadow: 0 20px 50px rgba(0, 0, 0, 0.3); border: 2px solid var(--gold-dark); position: relative; overflow: hidden;">
        
        <!-- LOGO -->
        <div style="text-align: center; margin-bottom: 25px;">
            <div style="width: 60px; height: 60px; background: var(--gold-gradient); color: #072b6b; border-radius: 18px; display: inline-flex; align-items: center; justify-content: center; font-weight: 900; font-size: 32px; box-shadow: 0 6px 16px rgba(255, 183, 3, 0.4); margin-bottom: 12px;">M</div>
            <h1 style="font-size: 26px; font-weight: 900; color: #072b6b; margin-bottom: 6px;">مرحباً بك في منصة الماهر 👋</h1>
            <p style="color: #64748b; font-size: 14px; font-weight: 600;">سجل دخولك بواسطة البريد الإلكتروني الموحد وكود الطالب</p>
        </div>

        <!-- TWO FIELDS LOGIN FORM -->
        <form id="dualFieldLoginForm">
            
            <!-- FIELD 1: UNIFIED EMAIL -->
            <div class="input-group" style="margin-bottom: 18px;">
                <label for="studentEmailInput" style="display: block; font-weight: 800; color: #0f172a; font-size: 14px; margin-bottom: 8px;">
                    البريد الإلكتروني الموحد ✉️
                </label>
                <div style="position: relative; display: flex; align-items: center;">
                    <span style="position: absolute; right: 14px; font-size: 18px; color: #0d47a1;">📧</span>
                    <input 
                        type="email" 
                        id="studentEmailInput" 
                        placeholder="مثال: 5892@almahermath.com" 
                        required 
                        style="width: 100%; height: 48px; padding: 0 45px 0 15px; border: 2px solid #e2e8f0; border-radius: 12px; font-weight: 700; font-size: 14.5px; font-family: inherit; outline: none;"
                    >
                </div>
            </div>

            <!-- FIELD 2: STUDENT CODE -->
            <div class="input-group" style="margin-bottom: 22px;">
                <label for="studentCodeInput" style="display: block; font-weight: 800; color: #0f172a; font-size: 14px; margin-bottom: 8px;">
                    كود الطالب الخاص بك 🔢
                </label>
                <div style="position: relative; display: flex; align-items: center;">
                    <span style="position: absolute; right: 14px; font-size: 18px; color: #fb8500;">🔑</span>
                    <input 
                        type="text" 
                        id="studentCodeInput" 
                        placeholder="مثال: 5892" 
                        required 
                        style="width: 100%; height: 48px; padding: 0 45px 0 15px; border: 2px solid #e2e8f0; border-radius: 12px; font-weight: 700; font-size: 14.5px; font-family: inherit; outline: none;"
                    >
                </div>
            </div>

            <div id="loginMessage" style="margin-bottom: 15px; font-weight: 800; font-size: 13.5px; text-align: center;"></div>

            <button type="submit" id="dualLoginBtn" style="width: 100%; height: 52px; background: var(--blue-gradient); color: white; border: none; border-radius: 12px; font-weight: 900; font-size: 16.5px; cursor: pointer; box-shadow: 0 6px 18px rgba(13, 71, 161, 0.3); font-family: inherit; display: flex; align-items: center; justify-content: center; gap: 8px;">
                <span>تسجيل الدخول للمنصة 🚀</span>
            </button>
        </form>

        <div style="text-align: center; margin-top: 25px; border-top: 1px solid #e2e8f0; padding-top: 20px;">
            <span style="color: #64748b; font-size: 14px; font-weight: 600;">ليس لديك حساب حتى الآن؟</span>
            <a href="register.html" style="color: #fb8500; font-weight: 900; font-size: 14px; text-decoration: none; margin-right: 6px;">إنشاء حساب جديد ✨</a>
        </div>

    </div>

    <script>
        // Global Dark Mode Sync
        if (localStorage.getItem('elmaher_dark_mode') === 'enabled') {
            document.documentElement.classList.add('dark-mode');
            document.body.classList.add('dark-mode');
        }

        document.getElementById('dualFieldLoginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const emailVal = document.getElementById('studentEmailInput').value.trim().toLowerCase();
            const codeVal = document.getElementById('studentCodeInput').value.trim().toLowerCase();
            const message = document.getElementById('loginMessage');
            const btn = document.getElementById('dualLoginBtn');

            if (!emailVal || !codeVal) {
                message.style.color = '#ef4444';
                message.textContent = 'من فضلك أدخل البريد الموحد وكود الطالب.';
                return;
            }

            btn.disabled = true;
            btn.textContent = 'جاري التحقق والدخول...';

            const studentAccounts = JSON.parse(localStorage.getItem('studentAccounts')) || [];
            
            // Strict dual match: check both email AND code
            const student = studentAccounts.find(s => 
                s.email && s.email.toLowerCase() === emailVal &&
                s.studentCode && s.studentCode.toLowerCase() === codeVal
            );

            if (student) {
                localStorage.setItem("userRole", "student");
                localStorage.setItem("userEmail", student.email);
                localStorage.setItem("studentLoggedIn", "true");
                localStorage.setItem("currentStudent", JSON.stringify(student));

                message.style.color = '#10b981';
                message.textContent = `مرحباً بك يا ${student.fullName}! تم تسجيل الدخول بنجاح 🎉`;

                setTimeout(() => {
                    window.location.href = "index.html";
                }, 800);
            } else {
                btn.disabled = false;
                btn.textContent = 'تسجيل الدخول للمنصة 🚀';
                message.style.color = '#ef4444';
                message.textContent = '❌ البريد الإلكتروني أو كود الطالب غير متطابقين. يرجى التأكد وإعادة المحاولة.';
            }
        });
    </script>
</body>
</html>
