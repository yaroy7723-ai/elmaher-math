<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إنشاء حساب جديد | منصة الماهر</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="CSS/register.css">
    <link rel="stylesheet" href="CSS/common.css">
</head>
<body style="background: linear-gradient(135deg, #072b6b 0%, #0d47a1 100%); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 25px 20px; font-family: 'Cairo', sans-serif;">

    <div class="auth-card" style="background: white; width: 100%; max-width: 480px; border-radius: 24px; padding: 35px; box-shadow: 0 20px 50px rgba(0, 0, 0, 0.3); border: 2px solid var(--gold-dark); position: relative; overflow: hidden;">
        
        <!-- LOGO HEADER -->
        <div style="text-align: center; margin-bottom: 25px;">
            <div style="width: 60px; height: 60px; background: var(--gold-gradient); color: #072b6b; border-radius: 18px; display: inline-flex; align-items: center; justify-content: center; font-weight: 900; font-size: 32px; box-shadow: 0 6px 16px rgba(255, 183, 3, 0.4); margin-bottom: 12px;">M</div>
            <h1 style="font-size: 26px; font-weight: 900; color: #072b6b; margin-bottom: 6px;">انضم إلى منصة الماهر ✨</h1>
            <p style="color: #64748b; font-size: 14px; font-weight: 600;">أنشئ حسابك التعليمي بسهولة لتوليد كودك الموحد فوراً</p>
        </div>

        <!-- FAST CLEAN REGISTER FORM -->
        <form id="studentRegisterForm">
            
            <!-- FIELD 1: FULL NAME -->
            <div class="input-group" style="margin-bottom: 18px;">
                <label for="fullName" style="display: block; font-weight: 800; color: #0f172a; font-size: 14px; margin-bottom: 8px;">
                    اسم الطالب بالكامل 👤 <span style="color: #ef4444;">*</span>
                </label>
                <div style="position: relative; display: flex; align-items: center;">
                    <span style="position: absolute; right: 14px; font-size: 18px; color: #0d47a1;">👨‍🎓</span>
                    <input 
                        type="text" 
                        id="fullName" 
                        placeholder="مثال: أحمد محمد علي" 
                        required 
                        style="width: 100%; height: 48px; padding: 0 45px 0 15px; border: 2px solid #e2e8f0; border-radius: 12px; font-weight: 700; font-size: 14.5px; font-family: inherit; outline: none;"
                    >
                </div>
            </div>

            <!-- FIELD 2: ACADEMIC LEVEL / GRADE -->
            <div class="input-group" style="margin-bottom: 22px;">
                <label for="studentGrade" style="display: block; font-weight: 800; color: #0f172a; font-size: 14px; margin-bottom: 8px;">
                    الصف / المرحلة الدراسية 📚 <span style="color: #ef4444;">*</span>
                </label>
                <div style="position: relative; display: flex; align-items: center;">
                    <span style="position: absolute; right: 14px; font-size: 18px; color: #fb8500;">🎓</span>
                    <select 
                        id="studentGrade" 
                        required 
                        style="width: 100%; height: 48px; padding: 0 45px 0 15px; border: 2px solid #e2e8f0; border-radius: 12px; font-weight: 700; font-size: 14.5px; font-family: inherit; outline: none; background: white; cursor: pointer;"
                    >
                        <option value="">اختر الصف الدراسي...</option>
                        <option value="الصف الأول الثانوي">الصف الأول الثانوي 🏫</option>
                        <option value="الصف الثاني الثانوي">الصف الثاني الثانوي 🏫</option>
                        <option value="الصف الثالث الثانوي">الصف الثالث الثانوي (الثانوية العامة) 👑</option>
                        <option value="المرحلة الإعدادية">المرحلة الإعدادية 📖</option>
                    </select>
                </div>
            </div>

            <div id="registerMessage" style="margin-bottom: 15px; font-weight: 800; font-size: 13.5px; text-align: center;"></div>

            <button type="submit" id="registerSubmitBtn" style="width: 100%; height: 52px; background: var(--blue-gradient); color: white; border: none; border-radius: 12px; font-weight: 900; font-size: 16.5px; cursor: pointer; box-shadow: 0 6px 18px rgba(13, 71, 161, 0.3); font-family: inherit; display: flex; align-items: center; justify-content: center; gap: 8px;">
                <span>إنشاء الحساب وتوليد الكود 🚀</span>
            </button>
        </form>

        <!-- SUCCESS CREDENTIALS POPUP MODAL -->
        <div id="credentialsModal" style="display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.75); z-index: 9999; align-items: center; justify-content: center; padding: 20px; backdrop-filter: blur(5px);">
            <div style="background: white; border-radius: 24px; padding: 30px; max-width: 440px; width: 100%; text-align: center; box-shadow: 0 25px 50px rgba(0,0,0,0.4); border: 2px solid var(--gold);">
                <div style="font-size: 55px; margin-bottom: 10px;">🎉</div>
                <h2 style="font-size: 24px; font-weight: 900; color: #072b6b; margin-bottom: 6px;">تم إنشاء حسابك بنجاح!</h2>
                <p style="color: #64748b; font-size: 13.5px; font-weight: 600; margin-bottom: 20px;">احتفظ بكود الطالب والبريد الموحد لتسجيل الدخول لاحقاً:</p>
                
                <div style="background: #f8fafc; border: 2px dashed #cbd5e1; border-radius: 16px; padding: 18px; text-align: right; margin-bottom: 22px;">
                    <div style="margin-bottom: 12px; border-bottom: 1px solid #e2e8f0; padding-bottom: 10px;">
                        <small style="color: #64748b; font-size: 12px; font-weight: 700; display: block;">كود الطالب الخاص بك:</small>
                        <strong id="modalStudentCode" style="color: #fb8500; font-size: 24px; font-weight: 900; letter-spacing: 1px;">----</strong>
                    </div>
                    <div>
                        <small style="color: #64748b; font-size: 12px; font-weight: 700; display: block;">البريد الإلكتروني الموحد:</small>
                        <strong id="modalStudentEmail" style="color: #072b6b; font-size: 15px; font-weight: 800; word-break: break-all;">----</strong>
                    </div>
                </div>

                <button onclick="window.location.href='index.html'" style="width: 100%; background: var(--blue-gradient); color: white; border: none; padding: 14px; border-radius: 12px; font-weight: 900; font-size: 16px; cursor: pointer; box-shadow: 0 6px 18px rgba(13,71,161,0.35); font-family: inherit;">
                    🚀 الانتقال للمنصة والبدء فوراً
                </button>
            </div>
        </div>

        <div style="text-align: center; margin-top: 25px; border-top: 1px solid #e2e8f0; padding-top: 20px;">
            <span style="color: #64748b; font-size: 14px; font-weight: 600;">لديك حساب بالفعل؟</span>
            <a href="login.html" style="color: #0d47a1; font-weight: 900; font-size: 14px; text-decoration: none; margin-right: 6px;">تسجيل الدخول 🔑</a>
        </div>

    </div>

    <script src="JS/register.js"></script>
</body>
</html>
